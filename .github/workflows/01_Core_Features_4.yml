name: Passing Data

on: 
  workflow_dispatch: 

jobs:
  producer:
    runs-on: ubuntu-latest

    outputs:
      surname: ${{ steps.status.outputs.surname }}

    steps:
      - name: Generating output
        id: status
        run: |
          echo "surname=nahar" >> $GITHUB_OUTPUT

      - name: Display output
        run: echo "${{ steps.status.outputs.surname }}"

  consumer:
    runs-on: ubuntu-latest
    needs: producer

    steps:
      - name: Display output from producer
        run: echo "${{ needs.producer.outputs.surname }}"

      - name: Display an unset output
        run: echo "${work:-<UNSET>}"

