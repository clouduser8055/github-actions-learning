name: Caching

on: 
  workflow_dispatch: 

jobs:
  actions-cache:
    runs-on: ubuntu-latest
    name: Prime demo cache

    steps:
      - name: restore cache
        id: demo-cache
        uses: actions/cache@v5
        with:
          path: demo-cache
          key: demo-cache-v1

      - name: populate cache directory
        if: steps.demo-cache.outputs.cache-hit != 'true'
        run: |
          echo "Cache miss - generating content"
          mkdir -p demo-cache
          date > demo-cache/timestamp.txt

      - name: Save cache
        if: steps.demo-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: demo-cache
          key: demo-cache-v1

      - name: Verify cache status
        run: |
          echo "cache-hit? -> ${{ steps.demo-cache.outputs.cache-hit}}"
          cat demo-cache/timestamp.txt


  python-cache:
    needs: actions-cache
    runs-on: ubuntu-latest

    steps:
      - name: Checkout rep
        uses: actions/checkout@v7

      - name: Python setup  
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Display python version
        run: python --version

        
