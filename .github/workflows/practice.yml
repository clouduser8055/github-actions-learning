name: practicing CI/CD Pipelines

on: 
  push: 
    branches:
      - "main"

  pull_request: 

jobs:
  job-1:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Python version
        run: python --version 

      - name: Using python shell
        run: print("Hello World!")
        shell: python

      - name: Use Secret in python
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }}

        run: |
          if not MY_SECRET:
            print("This Is Not My Secret")
          else:
            print(MY_SECRET)
            print("Good Work!")

        shell: python






























        
