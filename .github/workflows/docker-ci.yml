name: Docker CI

on:
  workflow_dispatch: 

permissions: 
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Check docker version
        run: docker --version

      - name: Build docker image
        run: |
          docker build --tag "github-actions-learning:${{ github.sha }}" .

      - name: Verify docker image
        run: |
          docker image inspect "github-actions-learning:${{ github.sha}}" --format 'Image ID: {{.Id}}'

      - name: Run application container
        run: |
          docker run --rm "github-actions-learning:${{ github.sha }}"