name: Docker CI and Publish

on:
  push: 
  pull_request: 
  workflow_dispatch: 

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker-build-test-publish:
    runs-on: ubuntu-latest

    permissions: 
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Check docker version
        run: docker --version

      - name: Build docker image
        run: |
          docker build --tag "$REGISTRY/$IMAGE_NAME:$GITHUB_SHA" .  

      - name: Test docker container
        run: |
          docker run --rm "$REGISTRY/$IMAGE_NAME:$GITHUB_SHA"

      - name: Log in to GHCR 
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main'}}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login "$REGISTRY" --username "$GITHUB_ACTOR" --password-stdin
        
      - name: Publish Docker Image
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          docker tag "$REGISTRY/$IMAGE_NAME:$GITHUB_SHA" "$REGISTRY/$IMAGE_NAME:latest"
          
          docker push "$REGISTRY/$IMAGE_NAME:$GITHUB_SHA"
          docker push "$REGISTRY/$IMAGE_NAME:latest"
        
