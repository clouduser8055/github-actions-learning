name: Composite Action

on: 
  workflow_dispatch: 

jobs:
  job-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Python setup using composite action
        id: python-env
        uses: ./.github/actions/setup-python-environment
        with:
          python-version: hello
          requirements-file: requirements.txt
          install-dependencies: "false"

      - name: Display Action outputs

        env:
          PYTHON_VERSION: ${{ steps.python-env.outputs.python-version }}
          PYTHON_EXECUTABLE: ${{ steps.python-env.outputs.python-executable }}
          DEPENDENCIES_INSTALLED: ${{ steps.python-env.outputs.dependencies-installed }}

        run: |
          echo "Python Version: $PYTHON_VERSION"
          echo "Python Executable: $PYTHON_EXECUTABLE"
          echo "Dependencies Installed: $DEPENDENCIES_INSTALLED"

      - name: Run python application
        run: python hello.py