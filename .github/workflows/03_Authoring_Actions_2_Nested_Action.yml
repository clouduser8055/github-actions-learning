name: Nested Action - Docker CI

on: 
  workflow_dispatch: 

permissions: 
  contents: read

jobs:
  job-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare Docker CI
        id: docker-env

        uses: $/.github/actions/docker-ci-prepare
        with:
          dockerfile-path: Dockerfile
          build-context: "."

          enable-qemu: "false"
          qemu-platforms: "arm64"

          builder-name: porfolio-builder

      - name: Display Docker CI result
        env:
          VALIDATED: ${{ steps.docker-env.outputs.context-validated }}
          BUILDER_NAME: ${{ steps.docker-env.outputs.builder-name }}
          BUILDER_DRIVER: ${{ steps.docker-env.outputs.builder-driver }}
          BUILDER_PLATFORMS: ${{ steps.docker-env.outputs.builder-platforms }}

        run: |
          echo "Context validated: $VALIDATED"
          echo "Builder: $BUILDER_NAME"
          echo "Driver: $BUILDER_DRIVER"
          echo "Platforms: $BUILDER_PLATFORMS"

      - name: Verify Docker Buildx
        env:
          BUILDER_NAME: ${{ steps.docker-env.outputs.builder-name }}
        run: |
          docker buildx version
          echo " "
          docker buildx ls
          echo " "
          docker buildx inspect "$BUILDER_NAME" --bootstrap

      - name: Build Docker Image
        run: | 
          docker buildx build --platform linux/amd64 --load --tag local/python-app:ci .

      - name: Verify Docker Image
        run: |
          docker image inspect local/python-app:ci



      