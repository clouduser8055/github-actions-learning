name: Nested Action - Docker CI

on: 
  workflow_dispatch: 

permissions: 
  contents: read

jobs:
  job-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Debug Repository
        shell: bash
        run: |
          echo "Current workspace:"
          echo "$GITHUB_WORKSPACE"

          echo "Current branch:"
          echo "$GITHUB_REF"

          echo "Repository files:"
          ls -la "$GITHUB_WORKSPACE"

          echo "Searching for Dockerfile:"
          find "$GITHUB_WORKSPACE" -maxdepth 4 -type f \
            \( -iname 'Dockerfile' -o -iname '*.dockerfile' \) -print

      - name: Prepare Docker CI
        id: docker-env

        uses: $/.github/actions/docker-ci-prepare
        with:
          dockerfile-path: Dockerfile
          build-context: "."

          enable-qemu: "false"
          qemu-platforms: "arm64"

          builder-name: porfolio-builder

      - name: Display Docker CI result
        env:
          VALIDATED: ${{ steps.docker-env.outputs.context-validated }}
          BUILDER_NAME: ${{ steps.docker-env.outputs.builder-name }}
          BUILDER_DRIVER: ${{ steps.docker-env.outputs.builder-driver }}
          BUILDER_PLATFORMS: ${{ steps.docker-env.outputs.builder-platforms }}

        run: |
          echo "Context validated: $VALIDATED"
          echo "Builder: $BUILDER_NAME"
          echo "Driver: $BUILDER_DRIVER"
          echo "Platforms: $BUILDER_PLATFORMS"

      - name: Verify Docker Buildx
        env:
          BUILDER_NAME: ${{ steps.docker-env.outputs.builder-name }}
        run: |
          docker buildx version
          echo " "
          docker buildx ls
          echo " "
          docker buildx inspect "$BUILDER_NAME" --bootstrap

      - name: Build Docker Image
        env:
          DOCKERFILE_PATH: ${{ steps.docker-env.outputs.dockerfile-absolute-path }}
          BUILD_CONTEXT: ${{ steps.docker-env.outputs.build-context-absolute-path }}

        run: |
          IMAGE="$REGISTRY/$IMAGE_NAME:$GITHUB_SHA"

          docker buildx build \
            --file "$DOCKERFILE_PATH" \
            --platform linux/amd64 \
            --load \
            --tag "$IMAGE" \
            "$BUILD_CONTEXT"

      - name: Verify Docker Image
        run: |
          docker image inspect "$REGISTRY/$IMAGE_NAME:$GITHUB_SHA"



      