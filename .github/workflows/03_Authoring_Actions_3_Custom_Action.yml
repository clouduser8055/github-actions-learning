name: Testing Custom Action - clouduser8055/setup-docker-buildx-action@v1.0.0

on: 
  workflow_dispatch: 

jobs:
  test-custom-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: setup docker buildx
        id: buildx
        uses: clouduser8055/setup-docker-buildx-action@v1.0.0
        with:
          enable-qemu: "true"
          qemu-platforms: arm64
          builder-name: production-builder

      - name: Display builder
        env:
          BUILDER: ${{ steps.buildx.outputs.builder-name }}
        run: |
          echo "Builder is $BUILDER"