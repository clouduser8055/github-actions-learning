name: Environment Variables and Secrets Configurations

on: 
  workflow_dispatch: 

env:
  my_name: "Anuj Nahar"

jobs:
  config:
    runs-on: ubuntu-latest

    steps:
      - name: using global env variable
        run: echo "This is $my_name ."

      - name: creating env vars
        run: echo "my_last_name=Nahar" >> $GITHUB_ENV

      - name: using my created env
        run: echo "$my_last_name"

      - name: using env vars from github secrets and variables
        run: echo "Environment --> ${{ vars.APP_ENV }}"

      - name: Checking secrets 
        env:
            MY_Secret: ${{secrets.MY_SECRET}}
        run: |
          if [ -n $MY_SECRET ];then
            echo "Secret is configured"
          else
            echo "Secret is missing"
          fi
