name: Caching

on: 
  workflow_dispatch: 

jobs:
  cache-action:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v7

      - name: using cache actions
        id: prime-cache 
        uses: actions/cache@v5
        with:
          path: my-caches
          key: ${{runner.os}}-primes

      - name: checking cache
        if: steps.prime-cache.outputs.cache-hit != 'true'
        run: echo "Missed"

      - name: checking cache
        if: steps.prime-cache.outputs.cache-hit == 'true'
        run: echo "Hit"
          