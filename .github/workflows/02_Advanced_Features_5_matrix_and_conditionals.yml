name: Matrix and Conditionals

on: 
  workflow_dispatch: 

concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix-job:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        number: [1, 2]
        letter: [a, b, c]
        exclude:
          - number: 1
            letter: c
          - number: 2
            letter: a

    timeout-minutes: 5

    steps:
      - name: display combinations
        run: |
          echo "Number: ${{ matrix.number }}, Letter: ${{ matrix.letter }}"

      - name: Run everywhere except 2c
        if: ${{ ! (matrix.number == 2 && matrix.letter == 'c' ) }}
        run: echo "This step is for combination of --> ${{ matrix.number }}${{ matrix.letter }}"

  sleep-job:
    runs-on: ubuntu-latest
    steps:
      - name: Sleep for 100 seconds
        run: sleep 100
        timeout-minutes: 2

      
