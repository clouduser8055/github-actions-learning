name: Dynamic Matrix

on: 
  workflow_dispatch: 
    inputs:
      length:
        description: "Nubmer of pairs to generate"
        required: true
        default: "2"

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      include: steps.gen.outputs.include

    steps:
      - name: Generate paired list
        id: gen
        env:
          LENGTH: ${{ github.event.inputs.length }}
        shell: bash
        run: |
          set -euo pipefail
          
          n=${LENGTH:-2}

          include_json=$(
            {
              for ((i=1;i<=n;i++));do
                first_value=$((RANDOM % 100))
                second_value=$((RANDOM % 100))
                jq -n -c --argjson first "$first_value" --argjson second "$second_value" '{first:$first, second:$second}'

              done
              } | jq -s -c .
          )

          echo "include=$include_json" >> "$GITHUB_OUTPUT"

  execute:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.generate-matrix.outputs.include) }}
    steps:
      - name: Use matrix values (paired random)
        run: echo "Matrix - First=${{ matrix.first }}, Second=${{ matrix.second }}"

