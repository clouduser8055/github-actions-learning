name: Python CI

on: 
  push:
  pull_request: 

env:
  APP_NAME: github-actions-learning

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Display python version
        run: python --version

      - name: Run python program
        run: python hello.py

      - name: Show application name
        run: echo "Application --> $APP_NAME"


      

    
        
      
        
        
