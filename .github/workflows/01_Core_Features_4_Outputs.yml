name: Passing Data

on: 
  workflow_dispatch: 

jobs:
  producer:
    runs-on: ubuntu-latest

    outputs:
      surname: ${{ steps.lastname.outputs.surname }}
      test-status: ${{ steps.test-status.outputs.status }}

    steps:
      - name: Generating output
        id: lastname
        run: |
          echo "surname=nahar" >> $GITHUB_OUTPUT

      - name: Display output
        run: echo "${{ steps.lastname.outputs.surname }}"

      - name: Generating Status
        id: test-status
        run: echo "status=passed" >> $GITHUB_OUTPUT

  consumer:
    needs: producer
    if: needs.producer.outputs.test-status == 'passed'
    runs-on: ubuntu-latest

    steps:
      - name: Display output from producer
        run: echo "${{ needs.producer.outputs.surname }}"

      - name: Display an unset output
        run: echo "${work:-<UNSET>}"

