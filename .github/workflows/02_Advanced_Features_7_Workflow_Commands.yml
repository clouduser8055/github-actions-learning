name: Workflow Commands

on: 
  workflow_dispatch: 

jobs:
  job-1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Log annotations
        run: |
          echo "::debug::Step started - hello from debug"

          echo "::warning title=some warning::this is a warning for you!!"

          file=".github/workflows/02_Advanced_Features_7_Workflow_Commands.yml"
          echo "::notice file=$file,line=23::By specifying a line (and optionally a column) the notice is linked to the source file"

          # echo "::notice title=message::learning log annotations"

          echo "::error title=test failed::Units test reported a failure!"

      # - name: Validate application
      #   run: |
      #     echo "::error title=Validation::Application Validation Failed"
      #     exit 1

      - name: Grouped logs
        run: |
          echo "::group::This is a group of logs"
          echo "Hello from within the group!"
          echo "::endgroup::"

      - name: Mask a value
        env:
          FOO: "bar"
        run: |
          echo "::add-mask::$FOO"
          echo "FOO is $FOO"

      - name: Stop & resume workflow commands
        run: |
          marker="END_RAW_OUTPUT"
          echo "::stop-commands::$marker"
          echo "::error::This is an error but not rendered as an error"
          echo "::$marker::"
          echo "::notice title=processed::The Process is Resumed"

      - name: Set an environment variable
        run: echo "BUILD_ID=$(date +%s)" >> "$GITHUB_ENV"

      - name: Set a step output variable
        id: pick-color
        run: echo "choice=pink" >> "$GITHUB_OUTPUT"

      - name: Append to step summary
        run: |
          echo "### Build completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build ID: $BUILD_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Colour: ${{ steps.pick-color.outputs.choice }}" >> "$GITHUB_STEP_SUMMARY"
      
      - name: check path
        run: echo "$PATH"

      - name: Add custom path
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: again check path
        run: echo "$PATH"

      