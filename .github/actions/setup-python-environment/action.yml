name: Setup Python Environment

description: Set up Python and Install project dependencies.

inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.13"

  requirements-file:
    description: Path to requirements.txt 
    required: false
    default: "requirements.txt"

  install-dependencies:
    description: Whether to intall python dependencies
    required: false
    default: "true"

outputs:
  python-version:
    description: Installed Python version
    value: ${{ steps.python-version.outputs.version }}

runs:
  using: composite

  steps:
    - name: Setup python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies
      if: ${{ (inputs.install-dependencies == 'true') }}
      shell: bash

      env:
        REQUIREMENTS_FILE: ${{ inputs.requirements-file }}

      run: |
        python -m pip install --upgrade pip

        if [[ -z "$REQUIREMENTS_FILE" ]];then
          echo "No requirement file supplied. Skipping."
        
        elif [[ -f "$REQUIREMENTS_FILE" ]];then
          python -m pip install -r "$REQUIREMENTS_FILE"

        else
          echo "::error::Requirements file is not found!"
          exit 1

        fi

    - name: Get python version
      id: python-version
      shell: bash

      run: |
        python_version=$(python --version)

        echo "version=$python_version" >> "$GITHUB_OUTPUT"

        echo "Installed: $python_version"



