name: Setup Python Environment

description: Set up Python and Install project dependencies.

inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.13"

  requirements-file:
    description: Path to requirements.txt 
    required: false
    default: "requirements.txt"

  install-dependencies:
    description: Whether to intall python dependencies
    required: false
    default: "true"

outputs:
  python-version:
    description: Installed Python version
    value: ${{ steps.python-version.outputs.version }}

  python-executable:
    description: Python executable Path
    value: ${{ steps.python-info.outputs.executable }}

  dependencies-installed:
    description: Whether dependencies were installed
    value: ${{ steps.dependencies.outputs.installed }}

runs:
  using: composite

  steps:
    - name: Validate inputs
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
        REQUIREMENTS_FILE:  ${{ inputs.requirements-file }}
        INSTALL_DEPENDENCIES: ${{ inputs.install-dependencies }}

      run: |
        set -euo pipefail

        echo "Validating inputs......"

        if [[ -z "$PYTHON_VERSION" ]];then
          echo "::error::Python version cannot be empty!"
          exit 1
        fi

        if [[ ! "$PYTHON_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]];then
          echo "::error::Invalid python version format!"
          exit 1
        fi

        case "$INSTALL_DEPENDENCIES" in 
          true|false)
            echo "::notice::Dependency installation setting is valid."
            ;;

          *)
            echo "::error::Use true or false for install-dependencies."
            exit 1
            ;;
        esac

        if [[ "$INSTALL_DEPENDENCIES" == "true" ]];then

          if [[ -z "$REQUIREMENTS_FILE"]];then
            echo "::error::Requirements file cannot be empty!"
            exit 1
          fi

          if [[ ! -f "$REQUIREMENTS_FILE" ]];then
            echo "::error::Requirements file doesn't exist!"
            exit 1
          fi

        fi

        echo "ALL INPUTS VALIDATED SUCCESSFULLY!"


    - name: Setup python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies
      id: dependencies
      shell: bash

      env:
        REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
        INSTALL_DEPENDENCIES: ${{ inputs.install-dependencies }}

      run: |
        set -euo pipefail

        if [[ "$INSTALL_DEPENDENCIES" == "false" ]];then
          echo "installed=false" >> "$GITHUB_OUTPUT"
          echo "Skipping Dependency Installation!"
          exit 1
        fi

        python -m pip install --upgrade pip
        python -m pip install -r "$REQUIREMENTS_FILE"

        echo "installed=true" >> "$GITHUB_OUTPUT"

    - name: Get python information
      id: python-info
      shell: bash

      run: |
        set -euo pipefail

        python_version=$(python --version)
        python_executable=$(command -v python)

        echo "version=$python_version" >> "$GITHUB_OUTPUT"
        echo "executable=$python_executable" >> $GITHUB_OUTPUT




